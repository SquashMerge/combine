[package]
name = "combine-app"
description = "Combine desktop app: Tauri backend"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
csp-probe = []

[dependencies]
combine-protocol = { path = "../../crates/combine-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.7", features = [] }
url = "=2.5.9"

[dev-dependencies]
combined = { path = "../../crates/combined", version = "=0.0.0", features = ["test-support"] }
futures = { version = "=0.3.34", default-features = false, features = ["std", "executor"] }

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }
