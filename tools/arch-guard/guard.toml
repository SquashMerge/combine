# Architecture guard rules: what .trellis/rules.toml can't express (SPEC.md, "Repository
# layout and architecture rules"). Checked by tools/arch-guard/check.py.
# Each rule retires when its trellis issue lands (milestone 0.3, #1263-#1272); the map, and
# the checks that stay here for good, are in docs/trellis-feature-request.md.
#
# Globs are checkout-relative: `*` and `?` stay within one path segment, `**` spans
# segments, and `dir/**` selects what is under dir, not dir.rs itself.
version = 1

# Directories never read. Explicit roots only: a skip glob that would hide a directory
# inside a package's src/ or a rule's scope is reported (guard-skip), not obeyed silently.
skip = [
  "target/**",
  "app/src-tauri/target/**",
  "app/web/dist/**",
  "**/node_modules/**",
  "**/__pycache__/**",
  ".reviews/**",
  # feature-factory run state and sandboxes (gitignored). Slice worktrees and sandbox clones are
  # full copies of the tree, so reading them reports every production file a second time.
  ".factory/**",
  ".factory-sandboxes/**",
]

# Cargo features that mark code as test-only, as in .trellis/rules.toml.
test_features = ["test-support"]

# Never production. Every rule skips these files (and Cargo packages whose manifest is
# under them), and `path_ban` forbids production code from reaching them.
non_production = [
  "spike/**",
  "tools/**",
  "crates/*/tests/**",
  "app/src-tauri/tests/**",
  "crates/combined/src/testing.rs",
  "crates/combined/src/testing/**",
  "app/web/test/**",
]

# --- Cargo dependency declarations, read from every workspace package's Cargo.toml:
# root `members` globs minus `exclude`, plus path dependencies inside the checkout.
# trellis maps Rust packages only from the root manifest; these rules cover the members.
# A declaration is banned even if no source uses it. Normal and build dependencies count
# (both table spellings, target tables, `workspace = true`, `package` renames);
# dev-dependencies are test-only and skipped.

[[crate_ban]]
id = "no-listener-crates"
crates = ["axum", "actix-web", "warp", "tiny_http", "hyper-server", "tokio-tungstenite", "tungstenite", "socket2"]
reason = "The daemon opens no network port; remote access is SSH only (SPEC.md, Security model)."

[[crate_ban]]
id = "no-pty-crates"
crates = ["portable-pty", "pty-process", "pty"]
reason = "herdr-core owns PTYs; Combine never opens one."

[[crate_ban]]
id = "no-webview-shell-or-fs"
crates = ["tauri-plugin-shell", "tauri-plugin-fs"]
reason = "The webview gets no shell or filesystem plugin."

[[crate_scope]]
id = "js-engine-only-in-daemon"
crates = ["rquickjs", "deno_core"]
packages = ["combined"]
reason = "Loaders run in the daemon's loader adapter only."

# --- Rust paths and identifiers in production source.
# A path rule matches `use` trees (braces expanded, aliases included) and qualified paths
# in code, after test-gated items are removed. Dependency renames map back to the real
# crate (`js::Runtime` with `js = { package = "rquickjs" }` is `rquickjs::Runtime`).
# It does not follow re-exports or `use` of a parent module (`use std as s;`).

[[rust_path]]
id = "core-does-no-io"
in = [
  "crates/combined/src/core.rs", "crates/combined/src/core/**",
  "crates/combined/src/ports.rs", "crates/combined/src/ports/**",
  "crates/combined/src/model.rs", "crates/combined/src/model/**",
]
forbid = [
  "std::fs", "std::process", "std::net", "std::os::unix::net",
  "tokio::fs", "tokio::process", "tokio::net",
]
reason = "Core, ports and model reach the world only through ports; adapters do the I/O."

[[rust_path]]
id = "js-engine-only-in-loader"
in = ["**"]
except = ["crates/combined/src/adapters/loader.rs", "crates/combined/src/adapters/loader/**"]
forbid = ["rquickjs", "deno_core"]
reason = "Only the loader adapter may use a JS engine."

# Listeners and PTYs. A conservative list of prohibited spellings, not proof that none
# exists: other ways to open a socket or a PTY need review (SPEC.md, architecture table).
# Identifier rules reserve names, so a local type called TcpListener is flagged too.
[[rust_ident]]
id = "no-listener-no-pty"
in = ["**"]
forbid = ["TcpListener", "TcpSocket", "UdpSocket", "openpty", "forkpty", "posix_openpt", "login_tty"]
reason = "No network listener (Unix sockets only) and no PTY in any production code."

[[rust_path]]
id = "no-raw-listen-or-pty"
in = ["**"]
forbid = ["libc::listen", "nix::sys::socket::listen", "nix::pty", "rustix::net::listen", "rustix::pty", "socket2"]
reason = "The same, through the system-call crates."

# --- Frontend imports: `import`, `export ... from`, `import()` and `require()`, read
# from tokens with string escapes decoded.

[[js_literal_imports]]
id = "frontend-imports-are-literal"
in = ["app/web/src/**"]
reason = "Every import names its module literally, so the rules below see it."

[[js_import]]
id = "tauri-only-in-ipc"
in = ["app/web/src/**"]
except = ["app/web/src/ipc/**"]
packages = ["@tauri-apps/*"]
reason = "Only app/web/src/ipc/ calls Tauri; everything else goes through it."

[[js_import]]
id = "no-webview-shell-or-fs-plugin"
in = ["**"]
packages = ["@tauri-apps/plugin-shell", "@tauri-apps/plugin-fs"]
reason = "The webview gets no shell or filesystem plugin."

[[source_language]]
id = "frontend-is-typescript"
in = ["app/web/src/**"]
forbid_extensions = [".js", ".jsx", ".mjs", ".cjs"]
reason = "Frontend sources are TypeScript, so trellis's TypeScript selectors see every import."

# --- Production code never reaches spike, test or test-support paths, in any app.
# Checks Cargo path dependencies, Rust `#[path]` and `include!`-family macros (normal and
# raw string literals), and relative frontend imports, including a directory's index.

[[path_ban]]
id = "no-production-dependency-on-non-production"
to = [
  "spike/**",
  "crates/*/tests/**",
  "app/src-tauri/tests/**",
  "crates/combined/src/testing.rs",
  "crates/combined/src/testing/**",
  "app/web/test/**",
]
reason = "The spike is disposable and tests are not product code."
