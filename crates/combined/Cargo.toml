[package]
name = "combined"
description = "Combine daemon: one per agent host"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Compiles the in-memory fake TerminalBackend (src/testing/) for tests.
test-support = []

[dependencies]
combine-protocol = { path = "../combine-protocol" }
async-trait = "=0.1.89"
futures = { version = "=0.3.32", default-features = false, features = ["std", "executor"] }
# Only for the O_NONBLOCK and O_NOFOLLOW open flags of the file store's reads.
libc = "=0.2.191"
notify = "=8.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.153"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread"] }
