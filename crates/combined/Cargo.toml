[package]
name = "combined"
description = "Combine daemon: one per agent host"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Compiles the in-memory fakes (src/testing/) for tests: the TerminalBackend, the file store and the diagram check.
test-support = []

[dependencies]
combine-protocol = { path = "../combine-protocol" }
async-trait = "=0.1.92"
futures = { version = "=0.3.34", default-features = false, features = ["std", "executor"] }
# Only for the O_NONBLOCK and O_NOFOLLOW open flags of the file store's reads.
libc = "=0.2.191"
notify = "=9.0.0"
# The JS engine, for the loader adapter only (tools/arch-guard: js-engine-only-in-loader).
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread"] }
