[package]
name = "combine"
description = "Combine CLI: the `combine mcp` shim"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "combine_cli"
path = "src/lib.rs"

[[bin]]
name = "combine"
path = "src/main.rs"

[dependencies]
combine-protocol = { path = "../combine-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }

[dev-dependencies]
combined = { path = "../combined", version = "=0.0.0", features = ["test-support"] }
