[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]
# spike/ (M0) stays outside the workspace: disposable, never a dependency.
exclude = ["spike"]

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "BUSL-1.1"
repository = "https://github.com/SquashMerge/combine"

# QuickJS is C, compiled by rquickjs-sys's build script at the profile's opt-level. Optimizing it in
# dev and test builds keeps the diagram-check tests and ./tools/verify quick; release is optimized anyway.
[profile.dev.package.rquickjs-sys]
opt-level = 3
